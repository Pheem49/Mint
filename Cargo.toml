[workspace]
members = [
  "crates/mint-core",
  "crates/mint-cli",
  "src-tauri",
]
resolver = "2"

[workspace.package]
version = "1.13.1"
edition = "2024"
license = "AGPL-3.0-only"

# Keep `target/debug` from ballooning and hold down peak linker memory
# (important on low-RAM machines — a full-debuginfo link of the test binary
# can OOM a 6 GB box). Our own crates keep enough debuginfo for backtraces
# with line numbers; dependencies (which we don't step through) carry none.
# `cargo check`/`clippy`/`tauri dev` use `dev`; `cargo test` uses `test`,
# which is spelled out here so it gets the same lean debuginfo rather than
# relying on profile inheritance. Release builds are unaffected.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
bcrypt = "0.17"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
chrono-tz = "0.10"
dirs = "6"
futures-util = "0.3"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
hmac = "0.12"
iana-time-zone = "0.1"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
quick-xml = "0.39"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
shlex = "1.3"
similar = "2"
srtlib = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time", "signal"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
uuid = { version = "1", features = ["v4"] }






<html lang="en">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mint">
  <link rel="apple-touch-icon" href="/assets/icon-512.png">

</body>
